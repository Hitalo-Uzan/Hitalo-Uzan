<!-- lock -->
<g class="shake" filter="url(#glow)">
  <path d="M135 140 V112 a35 35 0 0 1 70 0 V140" fill="none" stroke="#ff3860" stroke-width="10" stroke-linecap="round"/>
  <rect x="115" y="138" width="110" height="88" rx="10" fill="#1a0610" stroke="#ff3860" stroke-width="3"/>
  <circle cx="170" cy="174" r="11" fill="#ff3860"/>
  <rect x="166" y="180" width="8" height="24" rx="3" fill="#ff3860"/>
</g>
<text x="170" y="256" text-anchor="middle" class="m" font-size="11" fill="#ff3860" letter-spacing="3">NÍVEL 5 · ROOT</text>

<g transform="translate(380,60)">
  <text class="t g1" font-size="22" fill="#00f0ff" opacity="0.8" letter-spacing="4">⚠ ÁREA RESTRITA</text>
  <text class="t g2" font-size="22" fill="#ff2bd6" opacity="0.8" letter-spacing="4">⚠ ÁREA RESTRITA</text>
  <text class="t" font-size="22" fill="#ff3860" letter-spacing="4">⚠ ÁREA RESTRITA</text>
</g>
<text x="380" y="92" class="m" font-size="15" fill="#f9f002" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="0.50s" fill="freeze"/>$ sudo rm -rf /bugs</text><text x="380" y="118" class="m" font-size="15" fill="#cfc8ea" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="0.95s" fill="freeze"/>[sudo] senha para netrunner: ********</text><text x="380" y="144" class="m" font-size="15" fill="#ff3860" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="1.40s" fill="freeze"/>✖ ACESSO NEGADO — bugs não se apagam.</text><text x="380" y="170" class="m" font-size="15" fill="#cfc8ea" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="1.85s" fill="freeze"/>  se testam, se corrigem e viram nota no second brain.</text><text x="380" y="196" class="m" font-size="15" fill="#f9f002" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="2.30s" fill="freeze"/>$ SELECT COUNT(*) FROM bugs WHERE status = 'aberto';</text><text x="380" y="222" class="m" font-size="15" fill="#3dff9a" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="2.75s" fill="freeze"/>  0   -- (até o próximo deploy)</text>
<line x1="330" y1="48" x2="330" y2="260" stroke="#ff3860" stroke-opacity="0.4" stroke-dasharray="4 6"/>
<rect width="1200" height="300" fill="url(#scan)"/>
</g>
</svg>
