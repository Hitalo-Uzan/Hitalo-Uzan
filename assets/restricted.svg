<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Área restrita: sudo rm -rf /bugs. Acesso negado, bugs não se apagam: se testam, se corrigem e viram nota no second brain. Bugs abertos: 0, até o próximo deploy.">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowBig" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
  </pattern>

  <clipPath id="r"><rect width="1200" height="300" rx="14"/></clipPath>
</defs>
<style>
  .t { font-family: 'Share Tech Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace; font-weight: 700; }
  .m { font-family: 'Share Tech Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace; }
  .blink { animation: blink 1s infinite steps(1); }
  @keyframes blink { 0%{opacity:1} 50%{opacity:0} }
  @keyframes show { to { opacity: 1; } }
  .ln { opacity: 0; animation: show 0.01s steps(1) forwards; }

  .g1 { animation: g1 2.6s infinite steps(1); }
  .g2 { animation: g2 2.6s infinite steps(1); }
  @keyframes g1 { 0%{transform:translate(0,0)} 85%{transform:translate(-4px,1px)} 88%{transform:translate(5px,-1px)} 91%{transform:translate(0,0)} }
  @keyframes g2 { 0%{transform:translate(0,0)} 85%{transform:translate(4px,-1px)} 88%{transform:translate(-5px,1px)} 91%{transform:translate(0,0)} }
  .shake { animation: shake 4s infinite; transform-origin: 170px 150px; }
  @keyframes shake { 0%,80%,100%{transform:rotate(0)} 83%{transform:rotate(-8deg)} 86%{transform:rotate(8deg)} 89%{transform:rotate(-4deg)} 92%{transform:rotate(0)} }
</style>
<g clip-path="url(#r)">
<rect width="1200" height="300" fill="#05010f"/>
<rect width="1200" height="300" fill="#ff3860" opacity="0.04"/>
<g opacity="0.85"><polygon points="0,0 18,0 -2,22 -20,22" fill="#f9f002"/><polygon points="40,0 58,0 38,22 20,22" fill="#f9f002"/><polygon points="80,0 98,0 78,22 60,22" fill="#f9f002"/><polygon points="120,0 138,0 118,22 100,22" fill="#f9f002"/><polygon points="160,0 178,0 158,22 140,22" fill="#f9f002"/><polygon points="200,0 218,0 198,22 180,22" fill="#f9f002"/><polygon points="240,0 258,0 238,22 220,22" fill="#f9f002"/><polygon points="280,0 298,0 278,22 260,22" fill="#f9f002"/><polygon points="320,0 338,0 318,22 300,22" fill="#f9f002"/><polygon points="360,0 378,0 358,22 340,22" fill="#f9f002"/><polygon points="400,0 418,0 398,22 380,22" fill="#f9f002"/><polygon points="440,0 458,0 438,22 420,22" fill="#f9f002"/><polygon points="480,0 498,0 478,22 460,22" fill="#f9f002"/><polygon points="520,0 538,0 518,22 500,22" fill="#f9f002"/><polygon points="560,0 578,0 558,22 540,22" fill="#f9f002"/><polygon points="600,0 618,0 598,22 580,22" fill="#f9f002"/><polygon points="640,0 658,0 638,22 620,22" fill="#f9f002"/><polygon points="680,0 698,0 678,22 660,22" fill="#f9f002"/><polygon points="720,0 738,0 718,22 700,22" fill="#f9f002"/><polygon points="760,0 778,0 758,22 740,22" fill="#f9f002"/><polygon points="800,0 818,0 798,22 780,22" fill="#f9f002"/><polygon points="840,0 858,0 838,22 820,22" fill="#f9f002"/><polygon points="880,0 898,0 878,22 860,22" fill="#f9f002"/><polygon points="920,0 938,0 918,22 900,22" fill="#f9f002"/><polygon points="960,0 978,0 958,22 940,22" fill="#f9f002"/><polygon points="1000,0 1018,0 998,22 980,22" fill="#f9f002"/><polygon points="1040,0 1058,0 1038,22 1020,22" fill="#f9f002"/><polygon points="1080,0 1098,0 1078,22 1060,22" fill="#f9f002"/><polygon points="1120,0 1138,0 1118,22 1100,22" fill="#f9f002"/><polygon points="1160,0 1178,0 1158,22 1140,22" fill="#f9f002"/><polygon points="1200,0 1218,0 1198,22 1180,22" fill="#f9f002"/></g>
