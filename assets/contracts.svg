<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Contratos ativos: 0x01 Ghostwriter de marca, agente de copy com juiz LLM e eval; 0x02 CRM de alta voltagem, segmentação em tiers e públicos de ads; 0x03 Cofre de brindes, estoque e pedidos em NoSQL com travas atômicas; 0x04 Oráculo de preços, eficiência de venda, elasticidade e MMM; 0x05 Fluxo de aprovações de pagamento; 0x06 Cyberdeck do time, plugins pro Claude Code e second brain.">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowBig" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
  </pattern>
</defs>
<style>
  .t { font-family: 'Share Tech Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace; font-weight: 700; }
  .m { font-family: 'Share Tech Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace; }
  .blink { animation: blink 1s infinite steps(1); }
  @keyframes blink { 0%{opacity:1} 50%{opacity:0} }
  @keyframes show { to { opacity: 1; } }
  .ln { opacity: 0; animation: show 0.01s steps(1) forwards; }

  .edge { animation: edge 3s ease-in-out infinite; }
  @keyframes edge { 0%,100%{stroke-opacity:0.45} 50%{stroke-opacity:1} }
  .fill { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.4s ease-out forwards; }
  @keyframes grow { to { transform: scaleX(1); } }
</style>
