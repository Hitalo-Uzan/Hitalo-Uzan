<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Cartão de identidade netrunner e radar de habilidades: LLM e agentes 95, Data Eng 92, Automação 90, Cloud GCP 88, ML e estatística 86, Backend e API 82">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowBig" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
  </pattern>

  <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00f0ff" stop-opacity="0.16"/>
    <stop offset="0.5" stop-color="#7a00ff" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#ff2bd6" stop-opacity="0.18"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#fff" stop-opacity="0.13"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="card"><polygon points="40,40 560,40 600,80 600,420 80,420 40,380"/></clipPath>
</defs>
<style>
  .t { font-family: 'Share Tech Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace; font-weight: 700; }
  .m { font-family: 'Share Tech Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace; }
  .blink { animation: blink 1.2s infinite steps(1); }
  .sweep { animation: sweep 5s ease-in-out infinite; }
  .spin { transform-origin: 905px 240px; animation: spin 8s linear infinite; }
  .pulse { transform-origin: 905px 240px; animation: pulse 3s ease-in-out infinite; }
  .scanline { animation: sl 3.5s linear infinite; }
  @keyframes blink { 0%{opacity:1} 50%{opacity:0.15} }
  @keyframes sweep { 0%{transform:translateX(-700px)} 60%,100%{transform:translateX(700px)} }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
  @keyframes sl { 0%{transform:translateY(0)} 100%{transform:translateY(118px)} }
</style>
<rect width="1200" height="440" rx="14" fill="#05010f"/>

<!-- ID card -->
<g>
  <polygon points="40,40 560,40 600,80 600,420 80,420 40,380" fill="#0d0420"/>
  <polygon points="40,40 560,40 600,80 600,420 80,420 40,380" fill="url(#holo)"/>
  <g clip-path="url(#card)"><rect class="sweep" x="0" y="40" width="260" height="380" fill="url(#shine)" transform="skewX(-20)"/></g>
  <polygon points="40,40 560,40 600,80 600,420 80,420 40,380" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
  <rect x="40" y="40" width="300" height="34" fill="#f9f002"/>
  <text x="54" y="63" class="t" font-size="16" fill="#0b0218" letter-spacing="2">ID://NETRUNNER-0x2077</text>
  <text x="548" y="63" text-anchor="end" class="m" font-size="12" fill="#ff2bd6"><tspan class="blink">● ONLINE</tspan></text>

