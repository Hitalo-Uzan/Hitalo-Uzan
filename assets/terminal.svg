<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Terminal: whoami. Cientista de Dados e AI Engineer. Construo a encanação que leva dados do ERP, do e-commerce e do CRM até o warehouse, e depois faço esses dados falarem: dashboards, modelos e agentes de IA em produção. Diretrizes: dado sem teste é boato; produção é sagrada, merge só com aprovação humana; nunca confie num default; se dá pra automatizar, já devia estar num job.">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowBig" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
  </pattern>

  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff2bd6"/><stop offset="1" stop-color="#7a00ff"/>
  </linearGradient>
</defs>
<style>
  .t { font-family: 'Share Tech Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace; font-weight: 700; }
  .m { font-family: 'Share Tech Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace; }
  .blink { animation: blink 1s infinite steps(1); }
  @keyframes blink { 0%{opacity:1} 50%{opacity:0} }
  @keyframes show { to { opacity: 1; } }
  .ln { opacity: 0; animation: show 0.01s steps(1) forwards; }
</style>
<rect width="1200" height="360" rx="14" fill="#05010f"/>
<rect x="24" y="20" width="1152" height="320" rx="10" fill="#0b0218" stroke="#ff2bd6" stroke-width="1.5" filter="url(#glow)"/>
<path d="M34 20 H1166 a10 10 0 0 1 10 10 V52 H24 V30 a10 10 0 0 1 10 -10 Z" fill="url(#bar)" opacity="0.9"/>
<circle cx="48" cy="36" r="6" fill="#ff3860"/><circle cx="68" cy="36" r="6" fill="#f9f002"/><circle cx="88" cy="36" r="6" fill="#00f0ff"/>
<text x="600.0" y="41" text-anchor="middle" class="t" font-size="13" fill="#05010f" letter-spacing="2">netrunner@grid: ~/neural-link — zsh — 120×24</text>
<text x="1156" y="41" text-anchor="end" class="m" font-size="12" fill="#05010f">● SECURE</text>
<text x="60" y="92" class="m" font-size="15" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="0.30s" fill="freeze"/><tspan fill="#00f0ff">┌──(</tspan><tspan fill="#ff2bd6" font-weight="700">netrunner@grid</tspan><tspan fill="#00f0ff">)-[</tspan><tspan fill="#f5f0ff">~/neural-link</tspan><tspan fill="#00f0ff">]</tspan></text><text x="60" y="113" class="m" font-size="15" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="0.52s" fill="freeze"/><tspan fill="#00f0ff">└─$ </tspan><tspan fill="#f9f002" font-weight="700">whoami</tspan></text><text x="78" y="134" class="m" font-size="15" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="0.74s" fill="freeze"/><tspan fill="#f5f0ff" font-weight="700">Cientista de Dados </tspan><tspan fill="#ff2bd6" font-weight="700">&amp;</tspan><tspan fill="#f5f0ff" font-weight="700"> AI Engineer.</tspan></text><text x="78" y="155" class="m" font-size="15" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="0.96s" fill="freeze"/><tspan fill="#cfc8ea">Construo a encanação que leva dados do </tspan><tspan fill="#00f0ff">ERP</tspan><tspan fill="#cfc8ea">, do </tspan><tspan fill="#00f0ff">e-commerce</tspan><tspan fill="#cfc8ea"> e do </tspan><tspan fill="#00f0ff">CRM</tspan><tspan fill="#cfc8ea"> até o warehouse —</tspan></text><text x="78" y="176" class="m" font-size="15" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="1.18s" fill="freeze"/><tspan fill="#cfc8ea">e depois faço esses dados falarem: </tspan><tspan fill="#ff2bd6">dashboards</tspan><tspan fill="#cfc8ea">, </tspan><tspan fill="#ff2bd6">modelos</tspan><tspan fill="#cfc8ea"> e </tspan><tspan fill="#ff2bd6">agentes de IA</tspan><tspan fill="#cfc8ea"> em produção.</tspan></text><text x="60" y="197" class="m" font-size="15" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="1.40s" fill="freeze"/></text><text x="60" y="218" class="m" font-size="15" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="1.62s" fill="freeze"/><tspan fill="#00f0ff">└─$ </tspan><tspan fill="#f9f002" font-weight="700">cat /etc/diretrizes</tspan></text><text x="78" y="239" class="m" font-size="15" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="1.84s" fill="freeze"/><tspan fill="#ff2bd6" font-weight="700">[01] </tspan><tspan fill="#f5f0ff">dado sem teste é boato</tspan></text><text x="78" y="260" class="m" font-size="15" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="2.06s" fill="freeze"/><tspan fill="#ff2bd6" font-weight="700">[02] </tspan><tspan fill="#f5f0ff">produção é sagrada: merge só com aprovação humana</tspan></text><text x="78" y="281" class="m" font-size="15" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="2.28s" fill="freeze"/><tspan fill="#ff2bd6" font-weight="700">[03] </tspan><tspan fill="#f5f0ff">nunca confie num default — leia a doc, depois o código</tspan></text><text x="78" y="302" class="m" font-size="15" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="2.50s" fill="freeze"/><tspan fill="#ff2bd6" font-weight="700">[04] </tspan><tspan fill="#f5f0ff">se dá pra automatizar, já devia estar num job</tspan></text><text x="60" y="323" class="m" font-size="15" xml:space="preserve"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.98;1" dur="2.72s" fill="freeze"/><tspan fill="#00f0ff">└─$ </tspan><tspan fill="#f9f002" class="blink">█</tspan></text>
<rect x="24" y="20" width="1152" height="320" rx="10" fill="url(#scan)"/>
</svg>
